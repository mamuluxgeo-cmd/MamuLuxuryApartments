<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mamu Luxury Apartments</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="overlay"></div>
    <div class="hero-content">
      <h1>Mamu Luxury Apartments</h1>
      <p>პრემიუმ კლასის აპარტამენტები ბათუმში</p>
      <a href="#booking" class="btn">დაჯავშნა</a>
    </div>
  </header>

  <section class="section">
    <h2>ჩვენს შესახებ</h2>
    <p>კომფორტული, თანამედროვე და სრულად აღჭურვილი აპარტამენტები საუკეთესო ლოკაციაზე.</p>
  </section>

  <section id="booking" class="section">
    <h2>დაჯავშნის მოთხოვნა</h2>
    <form id="bookingForm">
      <input type="text" name="name" placeholder="სახელი და გვარი" required />
      <input type="tel" name="phone" placeholder="ტელეფონის ნომერი" required />
      <input type="date" name="checkin" required />
      <input type="date" name="checkout" required />
      <textarea name="note" placeholder="დამატებითი ინფორმაცია"></textarea>
      <button type="submit">გაგზავნა</button>
    </form>
    <p id="status"></p>
  </section>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
