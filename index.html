<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mamu Luxury Apartments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/mobile-gallery-touch.css" />
  <link rel="stylesheet" href="css/hero-redesign.css" />
</head>
<body data-theme="night">
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <header>
    <nav>
      <a class="brand" href="#top" id="siteTitle">Mamu Luxury Apartments</a>
      <div class="nav-links">
        <a href="#rooms" data-i18n="nav_rooms">ნომრები</a>
        <a href="#gallery" data-i18n="nav_gallery">გალერეა</a>
        <a href="#videos" data-i18n="nav_videos">ვიდეო</a>
        <a href="https://booking-116144.otelms.com/booking/rooms" target="_blank" data-i18n="nav_booking">დაჯავშნა</a>
      </div>
      <div class="nav-tools">
        <div class="language-switcher">
          <button type="button" data-lang="ka">KA</button>
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="ru">RU</button>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Theme">◐</button>
      </div>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-inner reveal">
        <div class="eyebrow" data-i18n="hero_welcome">მოგესალმებათ მამუ აპარტამენტი</div>
        <p id="heroSubtitle" class="hero-subtitle-hidden"></p>
        <div class="actions">
          <a href="#rooms" class="liquid-btn" data-i18n="hero_rooms_btn">აპარტამენტების ნახვა</a>
          <a href="https://booking-116144.otelms.com/booking/rooms" target="_blank" class="ghost-btn" data-i18n="hero_booking_btn">დაჯავშნა</a>
        </div>
      </div>
    </section>

    <section class="section reveal" id="rooms">
      <div class="section-head">
        <span class="eyebrow">20 Rooms / 5 Types</span>
        <h2 class="section-title" data-i18n="rooms_title">აპარტამენტების ტიპები</h2>
      </div>
      <div class="grid" id="roomTypes"></div>
    </section>

    <section class="section reveal" id="gallery">
      <div class="section-head">
        <span class="eyebrow">Gallery</span>
        <h2 class="section-title" data-i18n="gallery_title">გალერეა</h2>
      </div>
      <div class="gallery-grid" id="galleryGrid"></div>
    </section>

    <section class="section reveal" id="videos">
      <div class="section-head">
        <span class="eyebrow">Video Tour</span>
        <h2 class="section-title" data-i18n="videos_title">ვიდეოები</h2>
      </div>
      <div class="video-grid" id="videoGrid"></div>
    </section>

    <section class="section reveal" id="contact">
      <div class="contact-card">
        <span class="eyebrow">Contact</span>
        <h2 class="section-title" data-i18n="contact_title">კონტაქტი</h2>
        <div class="contact-list">
          <a id="phoneLink" href="#" data-i18n="phone_label">ტელეფონი</a>
          <a id="mapLink" href="#" target="_blank" data-i18n="map_label">რუკაზე ნახვა</a>
          <a id="whatsappLink" href="#" target="_blank">WhatsApp</a>
        </div>
      </div>
    </section>
  </main>

  <a class="whatsapp-float" id="whatsappFloat" href="#" target="_blank">WhatsApp</a>
  <footer class="footer">© 2026 Mamu Luxury Apartments</footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
