<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mamu Luxury Apartments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-theme="night">
  <header>
    <nav>
      <div class="brand" id="siteTitle">Mamu Luxury Apartments</div>
      <button class="theme-toggle" onclick="toggleTheme()">◐</button>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <div class="eyebrow">Luxury Liquid Glass Experience</div>
      <h1 id="heroTitle">Mamu Luxury Apartments</h1>
      <p id="heroSubtitle">პრემიუმ აპარტამენტები ბათუმში</p>
      <div class="actions">
        <a href="#rooms" class="liquid-btn">აპარტამენტების ნახვა</a>
        <a href="#contact" class="ghost-btn">დაჯავშნა</a>
      </div>
    </div>
  </section>

  <section class="section" id="rooms">
    <h2 class="section-title">აპარტამენტების ტიპები</h2>
    <div class="grid" id="roomTypes"></div>
  </section>

  <section class="section" id="contact">
    <h2 class="section-title">დაჯავშნა</h2>
    <p>სრული დაჯავშნის ფორმა დაემატება შემდეგ ეტაპზე.</p>
  </section>

  <footer class="footer">© 2026 Mamu Luxury Apartments</footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
