<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apartment Details — Mamu Luxury Apartments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/photo-lightbox.css" />
</head>
<body data-theme="night">
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <header>
    <nav>
      <a class="brand" href="index.html">Mamu Luxury Apartments</a>
      <div class="nav-links">
        <a href="index.html#rooms" data-i18n="nav_rooms">ნომრები</a>
        <a href="index.html#gallery" data-i18n="nav_gallery">გალერეა</a>
        <a href="https://booking-116144.otelms.com/booking/rooms" target="_blank" data-i18n="nav_booking">დაჯავშნა</a>
      </div>
      <div class="nav-tools">
        <div class="language-switcher">
          <button type="button" data-lang="ka">KA</button>
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="ru">RU</button>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Theme">◐</button>
      </div>
    </nav>
  </header>

  <main>
    <section class="section detail-hero">
      <div class="detail-layout">
        <div class="detail-copy">
          <span class="eyebrow" id="roomCategory">Apartment Type</span>
          <h1 class="section-title" id="roomName">იტვირთება...</h1>
          <p class="muted" id="roomDescription"></p>
          <div class="meta detail-meta" id="roomMeta"></div>
          <div class="actions">
            <a href="https://booking-116144.otelms.com/booking/rooms" target="_blank" class="liquid-btn" id="detailBookBtn" data-i18n="book_btn">დაჯავშნა</a>
            <a href="index.html#rooms" class="ghost-btn" data-i18n="back_btn">უკან დაბრუნება</a>
          </div>
        </div>
        <div class="detail-image-wrap">
          <img id="roomMainImage" class="detail-image" src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1200&q=80" alt="Apartment">
        </div>
      </div>
    </section>

    <section class="section" id="amenitiesSection">
      <div class="section-head">
        <span class="eyebrow">Amenities</span>
        <h2 class="section-title" data-i18n="amenities_title">კომფორტები</h2>
      </div>
      <div class="amenities-grid" id="amenitiesGrid"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <span class="eyebrow">Gallery</span>
        <h2 class="section-title" data-i18n="gallery_title">ფოტოები</h2>
      </div>
      <div class="gallery-grid" id="detailGallery"></div>
    </section>
  </main>

  <footer class="footer">© 2026 Mamu Luxury Apartments</footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/apartment.js"></script>
  <script src="js/photo-lightbox.js"></script>
</body>
</html>
