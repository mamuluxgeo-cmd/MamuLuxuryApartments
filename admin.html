<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Mamu Luxury Apartments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <main class="admin-app">
    <section class="login-screen" id="loginScreen">
      <div class="login-card">
        <span class="eyebrow">Mamu Luxury</span>
        <h1>Admin Panel</h1>
        <p>შედი სამართავ პანელში ჯავშნების, ნომრებისა და საიტის მონაცემების სამართავად.</p>
        <form id="loginForm" class="admin-form">
          <input type="text" name="username" placeholder="Username" required />
          <input type="password" name="password" placeholder="Password" required />
          <button type="submit">შესვლა</button>
          <small id="loginStatus"></small>
        </form>
      </div>
    </section>

    <section class="dashboard hidden" id="dashboardScreen">
      <aside class="sidebar">
        <div class="logo">Mamu Luxury</div>
        <button class="nav-btn active" data-view="dashboard">Dashboard</button>
        <button class="nav-btn" data-view="bookings">Bookings</button>
        <button class="nav-btn" data-view="roomTypes">Room Types</button>
        <button class="nav-btn" data-view="gallery">Gallery</button>
        <button class="nav-btn" data-view="rooms">Rooms</button>
        <button class="nav-btn" data-view="calendar">Calendar</button>
        <button class="nav-btn" data-view="settings">Settings</button>
        <button class="logout-btn" id="logoutBtn">Logout</button>
      </aside>

      <section class="content">
        <header class="admin-header">
          <div>
            <span class="eyebrow">Control Center</span>
            <h2 id="panelTitle">Dashboard</h2>
          </div>
          <button id="refreshBtn">განახლება</button>
        </header>

        <div class="stats-grid" id="statsGrid"></div>
        <div class="panel" id="mainPanel">იტვირთება...</div>
      </section>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin-upload.js"></script>
  <script src="js/admin-roomtypes.js"></script>
  <script src="js/admin-gallery.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/admin-roomtypes-loader.js"></script>
  <script src="js/admin-gallery-loader.js"></script>
</body>
</html>
